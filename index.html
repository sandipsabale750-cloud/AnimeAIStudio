
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime AI Studio</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="container">
<h1>✨ Anime AI Studio</h1>
<p class="subtitle">Your Personal Anime Creator</p>

<div class="card">
<h2>🖼️ Photo to Anime</h2>
<input type="file" id="photo" accept="image/*">
<img id="preview" style="display:none">
</div>

<div class="card">
<h2>✍️ Text to Anime</h2>
<textarea id="prompt" rows="4" placeholder="Describe your anime character..."></textarea>
</div>

<div class="card">
<h2>🎬 Image to Video</h2>
<p>Select a photo and describe your animation.</p>
</div>

<button onclick="generate()">✨ Generate Anime</button>
<p id="status"></p>
</div>
</body>
</html>
